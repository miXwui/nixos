# https://github.com/helix-editor/helix/wiki/Language-Server-Configurations

# NOTE: For some reason, indenting with `tab` in a Bash file defaults to the
# indentation used in the rest of the file. Similar to this issue:
# https://github.com/helix-editor/helix/issues/10028#issuecomment-2024792291
# > If you have a file that already has an indent of 2 spaces, you will have 2
# > spaces despite your configuration.

########################################
# simple-completion-language-server
[language-server.scls]
command = "simple-completion-language-server"

## https://github.com/estin/simple-completion-language-server?tab=readme-ov-file#configure
[language-server.scls.config]
max_completion_items = 20     # set max completion results len for each group: words, snippets, unicode-input
snippets_first = true         # completions will return before snippets by default
feature_words = true          # enable completion by word
feature_snippets = true       # enable snippets
feature_unicode_input = true  # enable "unicode input"
feature_paths = true          # enable path completion

# Git commit
[[language]]
name = "git-commit"
language-servers = ["scls"]
indent = { tab-width = 2, unit = "  " }

# introduce a new language to enable completion on any doc by forcing set language with :set-language stub
[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = ["scls"]
indent = { tab-width = 2, unit = "  " }

########################################
# efm-langserver

[language-server.efm]
command = "efm-langserver"
config = { provideFormatter = true }

########################################
# Bash

[[language]]
name = "bash"
formatter = { command = "shfmt", args = ["-i", "2"] }
language-servers = ["bash-language-server"]
indent = { tab-width = 2, unit = "  " }

########################################
# Dart

[language-server.dart.config.dart]
completeFunctionCalls = true

[[language]]
name = "dart"
language-servers = ["dart", "scls"]
formatter = { command = "dart", args = ["format"] }

########################################
# D2

# https://github.com/ravsii/tree-sitter-d2?tab=readme-ov-file#helix
[[language]]
name = "d2"
scope = "source.git"
file-types = ["d2"]
comment-token = "#"
roots = [""]
language-servers = ["scls"]
formatter = { command = "d2", args = ["fmt", "-"] }
indent = { tab-width = 2, unit = "  " }

# Run:
# ```sh
# hx --grammar fetch && hx --grammar build
# cp -r ~/.config/helix/runtime/grammars/sources/d2/queries/* ~/.config/helix/runtime/queries/d2/
# ```
[[grammar]]
source = { git = "https://github.com/ravsii/tree-sitter-d2", rev = "main" }
name = "d2"

########################################
# Elixir

[language-server.expert]
command = "expert"
args = ["--stdio"]

[[language]]
name = "elixir"
# auto-format = false
language-servers = ["expert", "scls"]
indent = { tab-width = 2, unit = "  " }
rulers = [100]

[[language]]
name = "heex"
# auto-format = false
language-servers = ["expert", "scls"]
indent = { tab-width = 2, unit = "  " }
rulers = [100]

########################################
# Lua

[[language]]
name = "lua"
language-servers = ["lua-language-server", "scls"]

########################################
# JSON

[[language]]
name = "json"
language-servers = [
  { name = "vscode-json-language-server", except-features = ["format"] },
]
formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }
auto-format = false
# indent = { tab-width = 2, unit = "  " }

########################################
# Markdown
# https://github.com/helix-editor/helix/discussions/11325#discussioncomment-13799986

[language-server.mpls]
command = "mpls"
args = ["--no-auto", "--full-sync", "--browser", "chromium", "--theme", "tokyonight", "--enable-emoji"]
# An example args entry showing how to specify flags with values:
# args = ["--port", "8080", "--browser", "google-chrome", "--theme", "gruvbox-dark"]
#

[[language]]
name = "markdown"
language-servers = ["marksman", "scls", "efm", "mpls" # { name = "efm", only-features = [ "diagnostics", "format" ] }
]

formatter = { command = "dprint", args = ["fmt", "--stdin", "md"] }
auto-format = false
indent = { tab-width = 2, unit = "  " }

########################################
# Nix

[language-server.nil]
command = "nil"
config = { provideFormatter = true }

[[language]]
name = "nix"
formatter = { command = "nixfmt" }
# auto-format = false
language-servers = ["nil", "scls"]
indent = { tab-width = 2, unit = "  " }

########################################
# Python

[language-server.ruff]
command = "ruff"

[[language]]
name = "python"
formatter = { command = "ruff", args = ["format", "-"] }
language-servers = ["ruff", "scls"]
indent = { tab-width = 2, unit = "  " }

########################################
# Web

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]
config.hostInfo = "helix"

## CSS

[[language]]
name = "css"
language-servers = [
  { name = "vscode-css-language-server", except-features = ["format"] },
  { name = "emmet-lsp" },
  { name = "scls" },
]
auto-format = false
formatter = { command = "dprint", args = ["fmt", "--stdin", "css"] }

## HTML

[[language]]
name = "html"
language-servers = [
  # { name = "biome" },
  # { name = "vscode-html-language-server", except-features = [ "format" ] },
  { name = "superhtml" },
  { name = "emmet-lsp" },
  { name = "scls" },
]
formatter = { command = "superhtml", args = ["fmt", "--stdin"] }
auto-format = false

## JavaScript

[language-server.vtsls.config.javascript]
updateImportsOnFileMove = { enabled = "always" }
suggest = { completeFunctionCalls = true }

[[language]]
name = "javascript"
language-servers = [
  { name = "biome" },
  { name = "vtsls", except-features = ["format"] },
  { name = "scls" },
]
indent = { tab-width = 2, unit = "  " }

### JSX

[[language]]
name = "jsx"
language-servers = [
  { name = "biome" },
  { name = "vtsls", except-features = ["format"] },
  { name = "scls" },
]
indent = { tab-width = 2, unit = "  " }

## TypeScript

[language-server.vtsls.config.typescript]
updateImportsOnFileMove = { enabled = "always" }
suggest = { completeFunctionCalls = true }

[[language]]
name = "typescript"
language-servers = [
  { name = "biome" },
  { name = "vtsls", except-features = ["format"] },
  { name = "scls" },
]
indent = { tab-width = 2, unit = "  " }

### TSX
[[language]]
name = "tsx"
language-servers = [
  { name = "biome" },
  { name = "vtsls", except-features = ["format"] },
  { name = "scls" },
]
indent = { tab-width = 2, unit = "  " }

########################################
# YAML

[language-server.yaml-language-server.config.yaml]
# https://github.com/redhat-developer/yaml-language-server?tab=readme-ov-file#language-server-settings
completion = true
validate = true # TODO: for some reason validation doesn't work?
hover = true
schemaStore.enable = true
format.enable = true # for some reason doesn't work, so using `ymlfmt`

[language-server.yaml-language-server.config.yaml.schemas]
"https://json.schemastore.org/github-workflow.json" = ".github/workflows/*.{yml,yaml}"
"https://raw.githubusercontent.com/ansible-community/schemas/main/f/ansible-tasks.json" = "roles/{tasks,handlers}/*.{yml,yaml}"
"https://garnix.io/api/garnix-config-schema.json" = "garnix.yaml"

[[language]]
name = "yaml"
file-types = ["yaml", "yml"]
language-servers = ["yaml-language-server"]
formatter = { command = "yamlfmt", args = ["-"] }

[[language]]
name = "toml"
language-servers = [
  { name = "tombi", except-features = ["format"] },
]
formatter = { command = "dprint", args = ["fmt", "--stdin", "toml"] }
